<mat-toolbar class="app-header" color="primary">
  <button
    mat-icon-button
    class="menu-toggle"
    type="button"
    matTooltip="Menu"
    aria-label="Alternar menu"
    (click)="onMenuToggle()"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>

  <div class="brand">
    <span class="brand-name">{{ appName }}</span>
    <span class="brand-subtitle">{{ appSubtitle }}</span>
  </div>

  <span class="header-spacer"></span>

  <div class="header-actions">
    <button
      mat-icon-button
      type="button"
      matTooltip="Mensagens"
      aria-label="Mensagens"
    >
      <mat-icon
        [matBadge]="unreadMessages"
        matBadgeColor="accent"
        matBadgeSize="small"
        aria-hidden="true"
      >
        mail
      </mat-icon>
    </button>

    @if (currentUser$ | async; as currentUser) {
      <button
        mat-button
        class="user-button"
        type="button"
        matTooltip="Usuario logado"
        aria-label="Usuario logado"
        [matMenuTriggerFor]="userMenu"
      >
        <span class="user-avatar" aria-hidden="true">{{ initials(currentUser) }}</span>
        <span class="user-name">{{ currentUser.name }}</span>
        <mat-icon aria-hidden="true">expand_more</mat-icon>
      </button>
    }

    <mat-menu #userMenu="matMenu" xPosition="before">
      @if (currentUser$ | async; as currentUser) {
        <button mat-menu-item type="button" disabled>
          <mat-icon aria-hidden="true">account_circle</mat-icon>
          <span>{{ currentUser.email }}</span>
        </button>
      }

      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
